<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stream Marathon – Twitch</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e0e10;color:#efeff1;font-family:"Segoe UI",system-ui,sans-serif}
.card{background:#18181b;border:1px solid #2f2f35;border-radius:12px;padding:32px 40px;text-align:center;max-width:420px}
h1{font-size:20px;margin:0 0 8px}
p{color:#adadb8;margin:0;line-height:1.5}
.ok{color:#00f593}.err{color:#ff4d6d}
</style>
</head>
<body>
<div class="card"><h1 id="h">Verbinde…</h1><p id="p"></p></div>
<script>
const h = document.getElementById('h'), p = document.getElementById('p');
const hash = new URLSearchParams(location.hash.slice(1));
const query = new URLSearchParams(location.search);
const token = hash.get('access_token');
history.replaceState(null, '', '/auth');
function done(ok, msg) {
  h.textContent = ok ? '✔ Mit Twitch verbunden' : '✖ Verbindung fehlgeschlagen';
  h.className = ok ? 'ok' : 'err';
  p.textContent = msg;
}
if (token) {
  fetch('/api/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) })
    .then(r => done(r.ok, r.ok ? 'Du kannst dieses Fenster schließen und zurück in die Stream-Marathon-App gehen.' : 'Die App hat den Login nicht angenommen.'))
    .catch(() => done(false, 'Die Stream-Marathon-App ist nicht erreichbar. Läuft sie noch?'));
} else {
  done(false, query.get('error_description') || 'Twitch hat keinen Login zurückgegeben. Versuch es in der App noch einmal.');
}
</script>
</body>
</html>
